<!DOCTYPE html>
<html lang="en">
<head>

  <style>/* Brand tokens — RealManage palette */
:root {
  --navy:      #121F38;  /* RealManage dark navy */
  --teal:      #054549;  /* RealManage deep forest teal */
  --orange:    #FF7350;  /* RealManage primary coral */
  --white:     #FFFFFF;
  --gray-50:   #F7F5F4;  /* RealManage warm off-white */
  --gray-100:  #EBE7DE;  /* RealManage warm beige */
  --gray-200:  #D4D8DF;
  --gray-600:  #6B7280;
  --gray-900:  #121F38;
  --green:     #2D7D46;
  --yellow:    #B07B10;
  --red:       #C0392B;
  --font:      'Work Sans', 'Inter', system-ui, sans-serif;
  --radius:    6px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.08);
  --shadow-md: 0 4px 12px rgba(0,0,0,.10);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font); background: var(--gray-50); color: var(--gray-900); font-size: 14px; }

/* Header */
#app-header {
  display: flex; align-items: center; gap: 16px;
  background: var(--white); padding: 12px 24px; height: 56px;
  border-bottom: 1px solid var(--gray-200);
}
#logo-text { font-size: 18px; font-weight: 700; color: var(--navy); }
.org-name {
  font-size: 12px; font-weight: 400; color: var(--gray-600);
  border-left: 1px solid var(--gray-200); padding-left: 12px; margin-left: 4px;
}

/* Tab bar */
#tab-bar {
  display: flex; background: var(--white);
  border-bottom: 2px solid var(--gray-200); padding: 0 24px;
}
.tab-btn {
  background: none; border: none; cursor: pointer;
  padding: 14px 20px; font-family: var(--font); font-size: 14px; font-weight: 500;
  color: var(--gray-600); border-bottom: 3px solid transparent; margin-bottom: -2px;
  transition: color .15s, border-color .15s;
  display: flex; align-items: center; gap: 8px;
}
.tab-btn:hover { color: var(--teal); }
.tab-btn.active { color: var(--teal); border-bottom-color: var(--teal); }
.p3rl-badge {
  font-size: 10px; font-weight: 600; background: var(--teal); color: var(--white);
  padding: 2px 8px; border-radius: 10px; letter-spacing: 0.03em;
}

/* Tab content */
.tab-content { display: none; padding: 24px; }
.tab-content.active { display: block; }

/* Section title */
.section-title {
  font-size: 13px; font-weight: 600; color: var(--gray-600);
  text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px;
}

/* BAN cards */
.ban-row {
  display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 24px;
}
.ban-card {
  background: var(--white); border: 1px solid var(--gray-200);
  border-radius: var(--radius); padding: 16px 20px;
  flex: 1; min-width: 140px; box-shadow: var(--shadow-sm);
}
.ban-card.lead {
  border-color: var(--orange); background: #fff5f2;
}
.ban-label { font-size: 11px; color: var(--gray-600); font-weight: 500; margin-bottom: 6px; }
.ban-value { font-size: 28px; font-weight: 700; color: var(--navy); line-height: 1; }
.ban-card.lead .ban-value { color: var(--orange); }
.ban-sub   { font-size: 11px; color: var(--gray-600); margin-top: 4px; }

/* Chart cards */
.chart-grid {
  display: grid; gap: 16px;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  margin-bottom: 24px;
}
.chart-grid.two-col { grid-template-columns: 1fr 1fr; }
.chart-grid.full    { grid-template-columns: 1fr; }
.chart-card {
  background: var(--white); border: 1px solid var(--gray-200);
  border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow-sm);
}
.chart-title {
  font-size: 13px; font-weight: 600; color: var(--gray-900);
  margin-bottom: 16px; display: flex; align-items: center; gap: 6px;
}
.chart-card canvas { max-height: 260px; }

/* Status chips */
.status-chip {
  display: inline-block; font-size: 11px; font-weight: 600;
  padding: 3px 10px; border-radius: 12px; text-transform: uppercase; letter-spacing: 0.04em;
}
.status-chip.at_risk    { background: #fde8e8; color: var(--red);    }
.status-chip.in_progress{ background: #fef3cd; color: var(--yellow); }
.status-chip.complete   { background: #d4edda; color: var(--green);  }

/* Integration tracker table */
.tracker-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.tracker-table th {
  text-align: left; font-size: 11px; font-weight: 600; color: var(--gray-600);
  text-transform: uppercase; letter-spacing: 0.05em;
  border-bottom: 2px solid var(--gray-200); padding: 8px 12px;
}
.tracker-table td { padding: 12px 12px; border-bottom: 1px solid var(--gray-100); }
.tracker-table tr:last-child td { border-bottom: none; }
.tracker-table tr:hover td { background: var(--gray-50); }

/* Collections risk table */
.risk-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.risk-table th {
  text-align: left; font-size: 11px; font-weight: 600; color: var(--gray-600);
  text-transform: uppercase; letter-spacing: 0.05em;
  border-bottom: 2px solid var(--gray-200); padding: 8px 12px;
}
.risk-table td { padding: 10px 12px; border-bottom: 1px solid var(--gray-100); }
.risk-table tr:last-child td { border-bottom: none; }
.risk-table .balance { font-weight: 600; color: var(--navy); }

/* Segmented control (heat map toggle) */
.seg-control {
  display: inline-flex; border: 1px solid var(--gray-200);
  border-radius: var(--radius); overflow: hidden;
}
.seg-control button {
  background: var(--white); border: none; cursor: pointer;
  padding: 6px 14px; font-family: var(--font); font-size: 12px; font-weight: 500;
  color: var(--gray-600); transition: background .15s, color .15s;
}
.seg-control button.active { background: var(--teal); color: var(--white); }
.seg-control button:not(:last-child) { border-right: 1px solid var(--gray-200); }

/* Chart header row (title + optional controls) */
.chart-header {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;
}
.chart-header .chart-title { margin-bottom: 0; }

/* Callout annotation */
.chart-callout {
  font-size: 11px; color: var(--gray-600); margin-top: 10px;
  padding: 6px 10px; background: var(--gray-50);
  border-left: 3px solid var(--teal); border-radius: 0 4px 4px 0;
}
</style>
</head>

// -- main.js --
// Shared chart registry
const _charts = {};
function destroyChart(id) {
  if (_charts[id]) { _charts[id].destroy(); delete _charts[id]; }
}

// Shared DOM helpers
function renderBAN(container, label, value, isLead = false, sub = '') {
  const card = document.createElement('div');
  card.className = 'ban-card' + (isLead ? ' lead' : '');
  card.innerHTML = `
    <div class="ban-label">${label}</div>
    <div class="ban-value">${value}</div>
    ${sub ? `<div class="ban-sub">${sub}</div>` : ''}
  `;
  container.appendChild(card);
}

function makeChartCard(id, title) {
  const card = document.createElement('div');
  card.className = 'chart-card';
  card.innerHTML = `<div class="chart-title">${title}</div><canvas id="${id}"></canvas>`;
  return card;
}

function sectionTitle(text) {
  const h = document.createElement('div');
  h.className = 'section-title';
  h.textContent = text;
  return h;
}

function banRow(cards) {
  const row = document.createElement('div');
  row.className = 'ban-row';
  cards.forEach(c => row.appendChild(c));
  return row;
}

function fmt(n)  { return n.toLocaleString(); }
function fmtDollar(n) { return '$' + (n / 1e6).toFixed(1) + 'M'; }
function fmtPct(n) { return n + '%'; }

// Tab routing
function renderTab(tabId) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  document.getElementById('tab-' + tabId).classList.add('active');
  document.querySelector('.tab-btn[data-tab="' + tabId + '"]').classList.add('active');

  if (tabId === 'integration') renderIntegrationTab();
  if (tabId === 'portfolio')   renderPortfolioTab();
}

document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => renderTab(btn.dataset.tab));
  });
  renderTab('integration');
});


// -- charts-tab1.js --
// ── Tab 1: Integration Efficiency ──────────────────────────────────────────

function renderFunnel(containerId) {
  const card = makeChartCard('funnel-chart', 'Record Matching Results');
  document.getElementById(containerId).appendChild(card);

  const C = CONFIG.integration;
  _charts['funnel-chart'] = new Chart(document.getElementById('funnel-chart'), {
    type: 'bar',
    data: {
      labels: [
        `Auto-matched (${C.autoMatchedPct}%)`,
        `Spot-check queue (${C.spotCheckPct}%)`,
        `Manual exceptions (${C.exceptionsPct}%)`,
      ],
      datasets: [{
        data: [C.autoMatched, C.spotCheck, C.exceptions],
        backgroundColor: [
          CONFIG.palette.green,
          CONFIG.palette.yellow,
          CONFIG.palette.red,
        ],
        borderRadius: 4,
      }],
    },
    options: {
      indexAxis: 'y',
      plugins: { legend: { display: false } },
      scales: {
        x: {
          ticks: { callback: v => fmt(v) },
          grid: { color: CONFIG.palette.gray2 },
        },
        y: { grid: { display: false } },
      },
    },
  });
}

function renderTimeline(containerId) {
  const card = document.createElement('div');
  card.className = 'chart-card';
  card.innerHTML = `<div class="chart-title">Integration Timeline: Without vs. With P3RL</div><canvas id="timeline-chart"></canvas>`;
  document.getElementById(containerId).appendChild(card);

  const phases = CONFIG.timeline.map(p => p.phase);
  // Build cumulative start offsets for floating bars [start, end]
  let withoutCursor = 0, withCursor = 0;
  const withoutBars = [], withBars = [];
  CONFIG.timeline.forEach(p => {
    withoutBars.push([withoutCursor, withoutCursor + p.without]);
    withoutCursor += p.without;
    withBars.push([withCursor, withCursor + p.with]);
    withCursor += p.with;
  });

  _charts['timeline-chart'] = new Chart(document.getElementById('timeline-chart'), {
    type: 'bar',
    data: {
      labels: phases,
      datasets: [
        {
          label: 'Without P3RL (18 wks)',
          data: withoutBars,
          backgroundColor: CONFIG.palette.coral + 'CC',
          borderRadius: 3,
        },
        {
          label: 'With P3RL (6 wks)',
          data: withBars,
          backgroundColor: CONFIG.palette.green + 'CC',
          borderRadius: 3,
        },
      ],
    },
    options: {
      indexAxis: 'y',
      plugins: { legend: { position: 'bottom' } },
      scales: {
        x: {
          title: { display: true, text: 'Weeks' },
          ticks: { stepSize: 2 },
          grid: { color: CONFIG.palette.gray2 },
        },
        y: { grid: { display: false } },
      },
    },
  });
}

function renderExceptionDonuts(containerId) {
  const wrapper = document.createElement('div');
  wrapper.className = 'chart-card';
  wrapper.innerHTML = `
    <div class="chart-title">Exception Queue by Record Type</div>
    <div style="display:flex;gap:16px;justify-content:center;align-items:center;padding:12px 0;">

      <canvas id="donut-vendors" width="140" height="140"></canvas>
      <canvas id="donut-boards"  width="140" height="140"></canvas>

  document.getElementById(containerId).appendChild(wrapper);

  const makeDonut = (id, label, count, total, color) => {
    _charts[id] = new Chart(document.getElementById(id), {
      type: 'doughnut',
      data: {
        labels: ['Exceptions', 'Matched'],
        datasets: [{ data: [count, total - count], backgroundColor: [color, CONFIG.palette.gray100], borderWidth: 0 }],
      },
      options: {
        responsive: false,
        cutout: '72%',
        plugins: {
          legend: { display: false },
          title: { display: true, text: [`${fmt(count)}`, label], font: { size: 11 }, color: CONFIG.palette.navy },
        },
      },
    });
  };

  const ex = CONFIG.exceptionsByType;
  const C  = CONFIG.integration;

function renderOwnerSegmentBar(containerId) {

    <div class="chart-callout" style="margin-top:14px;">

      invisible to CiraNet without P3RL identity resolution.
    </div>
  `;
  document.getElementById(containerId).appendChild(card);

  const V = CONFIG.venn;
  const P = CONFIG.palette;
  const totals = [V.aOnly + V.aPlusC, V.bOnly + V.bPlusC];

  _charts['owner-segment-chart'] = new Chart(document.getElementById('owner-segment-chart'), {
    type: 'bar',
    data: {
      labels: ['Single-community', 'Multi-community'],
      datasets: [
        {
          label: 'Current',
          data: [V.aOnly, V.bOnly],
          backgroundColor: P.teal + 'AA',
          borderColor: P.teal,
          borderWidth: 1,
        },
        {
          label: 'Delinquent',
          data: [V.aPlusC, V.bPlusC],
          backgroundColor: [P.coral + 'BB', P.red + 'EE'],
          borderColor: [P.coral, P.red],
          borderWidth: 1,
        },
      ],
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position: 'bottom', labels: { boxWidth: 12, padding: 14, font: { size: 12 } } },
        tooltip: {
          callbacks: {
            label: ctx => {
              const pct = Math.round(ctx.raw / totals[ctx.dataIndex] * 100);
              const base = ctx.dataset.label + ': ' + fmt(ctx.raw) + ' (' + pct + '%)';
              if (ctx.datasetIndex === 1 && ctx.dataIndex === 1) {
                return [base, 'Cross-portfolio risk — invisible without P3RL'];
              }
              return base;
            },
          },
        },
      },
      scales: {
        x: {
          stacked: true,
          grid: { color: P.gray2 + '44' },
          ticks: { callback: v => fmt(v), font: { size: 11 } },
        },
        y: {
          stacked: true,
          grid: { display: false },
          ticks: { font: { size: 12 } },

    },

function renderPortfolioSankey(containerId) {
  const card = document.createElement('div');
  card.className = 'chart-card';
  card.innerHTML = `<div class="chart-title">Owner Journey: Role to Payment Status</div><div id="sankey-div" style="width:100%;height:260px;"></div>`;
  document.getElementById(containerId).appendChild(card);

  const { leftNodes, rightNodes, flows } = CONFIG.sankey;
  const allNodes = [...leftNodes, ...rightNodes].map((n, i) => ({ ...n, index: i }));
  const nodeMap  = Object.fromEntries(allNodes.map(n => [n.id, n]));

  const sankeyLinks = flows.map(([src, tgt, val]) => ({
    source: nodeMap[src].index,
    target: nodeMap[tgt].index,
    value:  val,
  }));

  const div    = document.getElementById('sankey-div');
  const width  = div.clientWidth || 480;
  const height = 260;
  const svg    = d3.select(div).append('svg').attr('width', width).attr('height', height);

  const sankeyLayout = d3.sankey()
    .nodeId(d => d.index)
    .nodeWidth(16)
    .nodePadding(12)
    .extent([[1, 1], [width - 1, height - 6]]);

  const graph = sankeyLayout({ nodes: allNodes.map(d => ({ ...d })), links: sankeyLinks });

  const colors = [CONFIG.palette.blue, CONFIG.palette.slate,
                  CONFIG.palette.green, CONFIG.palette.yellow, CONFIG.palette.coral, CONFIG.palette.red];

  svg.append('g').selectAll('rect')
    .data(graph.nodes)
    .join('rect')
    .attr('x', d => d.x0).attr('y', d => d.y0)
    .attr('width', d => d.x1 - d.x0).attr('height', d => d.y1 - d.y0)
    .attr('fill', (d, i) => colors[i % colors.length])
    .append('title').text(d => `${d.label}: ${fmt(d.count)}`);

  svg.append('g').attr('fill', 'none')
    .selectAll('path')
    .data(graph.links)
    .join('path')
    .attr('d', d3.sankeyLinkHorizontal())
    .attr('stroke', (d, i) => colors[d.source.index % colors.length])
    .attr('stroke-width', d => Math.max(1, d.width))
    .attr('opacity', 0.45)
    .append('title').text(d => `${d.source.label} → ${d.target.label}: ${fmt(d.value)}`);

  svg.append('g').style('font-size', '11px')
    .selectAll('text')
    .data(graph.nodes)
    .join('text')
    .attr('x', d => d.x0 < width / 2 ? d.x1 + 6 : d.x0 - 6)
    .attr('y', d => (d.y1 + d.y0) / 2)
    .attr('dy', '0.35em')
    .attr('text-anchor', d => d.x0 < width / 2 ? 'start' : 'end')
    .text(d => d.label)
    .attr('fill', CONFIG.palette.navy);
}

function renderHeatMap(containerId, layer) {
  // layer: 'raw' | 'linked'
  const existing = document.getElementById('heatmap-card');
  if (existing) existing.remove();

  const card = document.createElement('div');
  card.className = 'chart-card';
  card.id = 'heatmap-card';
  card.innerHTML = `
    <div class="chart-header">
      <div class="chart-title">Owner Distribution by State</div>
      <div class="seg-control" id="heatmap-toggle">
        <button data-layer="raw"    class="${layer === 'raw'    ? 'active' : ''}">Raw Records</button>
        <button data-layer="linked" class="${layer === 'linked' ? 'active' : ''}">Linked Entities</button>
      </div>
    </div>
    <div id="heatmap-div" style="width:100%;height:220px;position:relative;"></div>
  `;
  document.getElementById(containerId).appendChild(card);

  // Attach toggle listeners
  card.querySelectorAll('#heatmap-toggle button').forEach(btn => {
    btn.addEventListener('click', () => renderHeatMap(containerId, btn.dataset.layer));
  });

  // Data for each layer
  const stateData = {};
  CONFIG.states.forEach(s => {
    stateData[s] = {
      raw:    CONFIG.stateRawRecords[s] || 0,
      linked: CONFIG.stateLinkedRate[s] || 0,
      rawVendor: CONFIG.vendorRaw[s] || 0,
    };
  });

  const getValue = s => layer === 'raw'
    ? stateData[s].raw
    : Math.round(stateData[s].linked * (CONFIG.stateRawRecords[s] || 0));

  const values = CONFIG.states.map(getValue).filter(v => v > 0);
  const maxVal = Math.max(...values, 1);
  const colorScale = d3.scaleSequential([0, maxVal], d3.interpolateBlues);

  const div    = document.getElementById('heatmap-div');
  const width  = div.clientWidth || 440;
  const height = 220;
  const proj   = d3.geoAlbersUsa().fitSize([width, height], { type: 'Sphere' });
  const path   = d3.geoPath().projection(proj);
  const svg    = d3.select(div).append('svg').attr('width', width).attr('height', height);

  fetch('https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json')
    .then(r => r.json())
    .then(us => {
      const fipsMap = CONFIG.stateFips;
      const invFips = Object.fromEntries(Object.entries(fipsMap).map(([k, v]) => [v, k]));

      svg.append('g').selectAll('path')
        .data(topojson.feature(us, us.objects.states).features)
        .join('path')
        .attr('d', path)
        .attr('fill', d => {
          const abbr = invFips[String(d.id).padStart(2, '0')];
          if (!abbr || !CONFIG.states.includes(abbr)) return '#e8edf4';
          const v = getValue(abbr);
          return v === 0 ? '#d4d8df' : colorScale(v);
        })
        .attr('stroke', '#fff').attr('stroke-width', 0.5)
        .append('title').text(d => {
          const abbr = invFips[String(d.id).padStart(2, '0')];
          if (!abbr || !CONFIG.states.includes(abbr)) return '';
          const raw = CONFIG.stateRawRecords[abbr] || 0;
          if (raw === 0) return `${abbr}: No data`;
          const linkedRate = fmtPct(Math.round(CONFIG.stateLinkedRate[abbr] * 100));
          return `${abbr}: ${fmt(raw)} records | Linked rate: ${linkedRate}`;
        });
    });
}
